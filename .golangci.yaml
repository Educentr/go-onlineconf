# Формат конфига соответствует мажору golangci-lint из GOLANGCI_TAG в Makefile.
# При смене пина прогнать `make lint-config-verify` (ловит ключи, которых в новой
# версии нет) и `make full-lint`: деактивированный линтер в enable роняет run с
# exit 7, не выдав ни одного замечания, — так из списка ушёл exportloopref.
# Версия языка для анализа не задаётся: берётся из директивы go в go.mod.
run:
  timeout: 30m
linters:
  disable-all: true
  enable:
    - asciicheck
    - bodyclose
    - contextcheck
    - unused
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - forcetypeassert
    - goconst
    - gocritic
    - gofmt
    - ireturn
    - staticcheck
    - makezero
    - misspell
    - prealloc
    - predeclared
    - unparam
    - whitespace
    - goimports
    - revive
linters-settings:
  lll:
    line-length: 120
  revive:
    ignore-generated-header: true
  gocritic:
    disabled-tags:
      - style

